    <ellipse cx="-18" cy="23" rx="15" ry="29" fill="#FAF7F2" transform="rotate(36 -18 23)"/>
    <ellipse cx="18" cy="23" rx="15" ry="29" fill="#FAF7F2" transform="rotate(-36 18 23)"/>
  </g>
